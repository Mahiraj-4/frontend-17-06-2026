<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Bio & Resource Shelf - Mini Project 7 (Task 3)</title>
  <link rel="stylesheet" href="style.css">
  <script src="validate.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <h1>Study Resource Shelf</h1>
      <button id="themeToggleBtn" type="button" class="theme-btn">Dark Mode</button>
    </header>

    <p id="storageWarning" class="warning-msg"></p>

    <form id="resourceForm" class="resource-form" novalidate>
      <input id="titleInput" type="text" placeholder="Resource title (3-60 chars)">
      <input id="urlInput" type="text" placeholder="https://example.com/maths">
      <select id="subjectSelect">
        <option value="">-- Select Subject --</option>
        <option value="Maths">Maths</option>
        <option value="Science">Science</option>
        <option value="JavaScript">JavaScript</option>
        <option value="HTML/CSS">HTML/CSS</option>
        <option value="Database">Database</option>
      </select>
      <button id="submitBtn" type="submit">Add</button>
    </form>

    <p id="formError" class="error-msg"></p>
    <div id="shelf" class="shelf-grid"></div>
  </div>
</body>
</html>
