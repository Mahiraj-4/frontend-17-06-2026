<!-- 1.
Create a Bootstrap Navbar for a music playlist app like Spotify, including links for Home, Playlists, and Profile. Make sure it collapses into a hamburger menu on mobile.
2.
Design a Bootstrap Card to display a Flipkart-style product preview with an image, product name, price, and a 'Buy Now' button.
3.
Build a Bootstrap Carousel that cycles through 3 movie posters, each with a caption below like BookMyShow's featured movies section.<br><br><em><strong>Hint:</strong> Use Bootstrap's Carousel component and add images with captions inside each carousel-item.</em>
4.
Create a Bootstrap Form for a Zomato-style restaurant review: include fields for name, rating (1-5 stars), and a review message, along with a submit button.
5.
Use Bootstrap Buttons to create a row of filter buttons (e.g., 'All', 'Veg', 'Non-Veg', 'Desserts') for a food delivery app homepage. Highlight the selected filter using the 'active' class.
 -->

 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap UI Tasks</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- =====================================================
         1. BOOTSTRAP NAVBAR - SPOTIFY STYLE
    ====================================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                🎵 MusicApp
            </a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#musicNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="musicNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Playlists
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Profile
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- =====================================================
         2. BOOTSTRAP CARD - FLIPKART STYLE PRODUCT
    ====================================================== -->

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Product Preview
        </h2>

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card shadow">

                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                        class="card-img-top"
                        alt="Running Shoes">

                    <div class="card-body">

                        <h5 class="card-title">
                            Stylish Running Shoes
                        </h5>

                        <p class="card-text text-muted">
                            Comfortable and lightweight sports shoes.
                        </p>

                        <h4 class="text-success">
                            ₹1,999
                        </h4>

                        <button class="btn btn-primary w-100">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         3. BOOTSTRAP CAROUSEL - MOVIE POSTERS
    ====================================================== -->

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Featured Movies
        </h2>

        <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

            <!-- Carousel Indicators -->
            <div class="carousel-indicators">

                <button type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide-to="0"
                    class="active">
                </button>

                <button type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide-to="1">
                </button>

                <button type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide-to="2">
                </button>

            </div>


            <!-- Carousel Items -->
            <div class="carousel-inner">

                <div class="carousel-item active">

                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
                        class="d-block w-100"
                        style="height: 400px; object-fit: cover;"
                        alt="Movie 1">

                    <div class="carousel-caption d-block">

                        <h3>Movie One</h3>

                        <p>Now Showing in Theatres</p>

                    </div>

                </div>


                <div class="carousel-item">

                    <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c"
                        class="d-block w-100"
                        style="height: 400px; object-fit: cover;"
                        alt="Movie 2">

                    <div class="carousel-caption d-block">

                        <h3>Movie Two</h3>

                        <p>Book Your Tickets Now</p>

                    </div>

                </div>


                <div class="carousel-item">

                    <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1"
                        class="d-block w-100"
                        style="height: 400px; object-fit: cover;"
                        alt="Movie 3">

                    <div class="carousel-caption d-block">

                        <h3>Movie Three</h3>

                        <p>Featured Movie of the Week</p>

                    </div>

                </div>

            </div>


            <!-- Previous Button -->
            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>


            <!-- Next Button -->
            <button class="carousel-control-next"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>


    <!-- =====================================================
         4. BOOTSTRAP FORM - ZOMATO STYLE REVIEW
    ====================================================== -->

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Restaurant Review
        </h2>

        <div class="row justify-content-center">

            <div class="col-md-6">

                <form class="border p-4 rounded shadow">

                    <!-- Name -->
                    <div class="mb-3">

                        <label for="name" class="form-label">
                            Your Name
                        </label>

                        <input type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- Rating -->
                    <div class="mb-3">

                        <label for="rating" class="form-label">
                            Rating
                        </label>

                        <select id="rating"
                            class="form-select"
                            required>

                            <option value="">
                                Select Rating
                            </option>

                            <option value="5">
                                ⭐⭐⭐⭐⭐ - 5 Stars
                            </option>

                            <option value="4">
                                ⭐⭐⭐⭐ - 4 Stars
                            </option>

                            <option value="3">
                                ⭐⭐⭐ - 3 Stars
                            </option>

                            <option value="2">
                                ⭐⭐ - 2 Stars
                            </option>

                            <option value="1">
                                ⭐ - 1 Star
                            </option>

                        </select>

                    </div>


                    <!-- Review -->
                    <div class="mb-3">

                        <label for="review" class="form-label">
                            Your Review
                        </label>

                        <textarea id="review"
                            class="form-control"
                            rows="4"
                            placeholder="Write your review..."
                            required>
                        </textarea>

                    </div>


                    <!-- Submit -->
                    <button type="submit"
                        class="btn btn-danger w-100">

                        Submit Review

                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- =====================================================
         5. BOOTSTRAP FILTER BUTTONS
    ====================================================== -->

    <div class="container mt-5 mb-5">

        <h2 class="text-center mb-4">
            Food Filters
        </h2>

        <div class="d-flex justify-content-center gap-2 flex-wrap">

            <!-- Selected Filter -->
            <button class="btn btn-primary active">
                All
            </button>

            <button class="btn btn-outline-success">
                Veg
            </button>

            <button class="btn btn-outline-danger">
                Non-Veg
            </button>

            <button class="btn btn-outline-warning">
                Desserts
            </button>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
