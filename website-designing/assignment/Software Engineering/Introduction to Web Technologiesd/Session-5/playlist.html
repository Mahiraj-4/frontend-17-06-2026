<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Playlist</title>

    <style>

        /* Class Selector */

        .playlist-item {
            background-color: #181818;
            color: white;

            padding: 20px;
            margin: 10px;

            border-radius: 8px;

            font-family: Arial, sans-serif;
        }


        /* ID Selector - Currently Playing Song */

        #currently-playing {
            background-color: #1db954;
            color: white;

            font-weight: bold;

            border: 3px solid #ffffff;
        }

    </style>
</head>

<body>

    <h1>My Spotify Playlist</h1>

    <div class="playlist-item">
        Blinding Lights - The Weeknd
    </div>

    <div class="playlist-item" id="currently-playing">
        Shape of You - Ed Sheeran 🎵 Currently Playing
    </div>

    <div class="playlist-item">
        Perfect - Ed Sheeran
    </div>

    <div class="playlist-item">
        Believer - Imagine Dragons
    </div>

</body>

</html>
