<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Card</title>
</head>

<body>

    <div style="
        width: 280px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px #ccc;
    ">

        <!-- Attractive Product Image -->
        <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=600&q=80"
             alt="Premium Smartphone"
             width="250"
             height="220"
             style="
                object-fit: cover;
                border-radius: 8px;
             ">

        <!-- Inline CSS applied only to product title -->
        <h2 style="
            background-color: #fff3cd;
            font-size: 24px;
        ">
            Samsung Galaxy Smartphone
        </h2>

        <p>
            Latest smartphone with powerful features and premium design.
        </p>

        <h3>
            ₹24,999
        </h3>

        <button>
            Add to Cart
        </button>

    </div>

</body>

</html>
