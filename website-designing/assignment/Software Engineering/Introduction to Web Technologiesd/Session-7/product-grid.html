<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Grid</title>

    <style>
        .product-grid {
            display: grid;

            /* 3 columns and 2 rows */
            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
            padding: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
            background-color: white;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product-card h3 {
            color: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Product Grid</h1>

    <section class="product-grid">

        <!-- Smartphone -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
                alt="Smartphone">
            <h3>Smartphone</h3>
        </div>

        <!-- Laptop -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
                alt="Laptop">
            <h3>Laptop</h3>
        </div>

        <!-- Headphones -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                alt="Headphones">
            <h3>Headphones</h3>
        </div>

        <!-- Smart Watch -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                alt="Smart Watch">
            <h3>Smart Watch</h3>
        </div>

        <!-- Camera -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
                alt="Digital Camera">
            <h3>Digital Camera</h3>
        </div>

        <!-- Sports Shoes -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                alt="Sports Shoes">
            <h3>Sports Shoes</h3>
        </div>

    </section>

</body>

</html>
