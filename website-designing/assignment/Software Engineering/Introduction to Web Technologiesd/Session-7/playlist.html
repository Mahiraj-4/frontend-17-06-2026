<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Playlist Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Horizontal Playlist Bar */
        .playlist {
            display: flex;

            /* Cards ek row me aayenge */
            flex-direction: row;

            /* Cards ke beech equal space */
            justify-content: space-between;

            /* Text vertically center hoga */
            align-items: center;

            gap: 15px;

            background-color: #1db954;
            padding: 20px;
            border-radius: 12px;
        }

        /* Song Card */
        .song-card {
            display: flex;

            /* Song name aur artist vertically center */
            align-items: center;

            flex: 1;

            min-height: 100px;

            padding: 20px;

            background-color: #282828;
            border-radius: 10px;

            transition: 0.3s;
        }

        .song-card:hover {
            background-color: #3d3d3d;
            transform: translateY(-5px);
        }

        .song-info {
            text-align: center;
            width: 100%;
        }

        .song-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .artist {
            color: #b3b3b3;
            font-size: 14px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .playlist {
                flex-direction: column;
            }

            .song-card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>🎵 My Spotify Playlist</h1>

    <div class="playlist">

        <div class="song-card">
            <div class="song-info">
                <div class="song-name">Kesariya</div>
                <div class="artist">Arijit Singh</div>
            </div>
        </div>

        <div class="song-card">
            <div class="song-info">
                <div class="song-name">Blinding Lights</div>
                <div class="artist">The Weeknd</div>
            </div>
        </div>

        <div class="song-card">
            <div class="song-info">
                <div class="song-name">Shape of You</div>
                <div class="artist">Ed Sheeran</div>
            </div>
        </div>

        <div class="song-card">
            <div class="song-info">
                <div class="song-name">Tum Hi Ho</div>
                <div class="artist">Arijit Singh</div>
            </div>
        </div>

        <div class="song-card">
            <div class="song-info">
                <div class="song-name">Perfect</div>
                <div class="artist">Ed Sheeran</div>
            </div>
        </div>

    </div>

</body>
</html>
