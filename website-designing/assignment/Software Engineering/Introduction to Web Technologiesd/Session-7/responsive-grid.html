<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    h1 {
        text-align: center;
        margin: 25px 0;
    }

    .product-grid {
        display: grid;

        /* Desktop: 3 columns */
        grid-template-columns: repeat(3, 1fr);

        gap: 20px;
        padding: 20px;
        max-width: 1200px;
        margin: auto;
    }

    .product-card {
        background: white;
        border: 1px solid #ddd;
        padding: 15px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        border-radius: 8px;
    }

    .product-card h3 {
        margin-top: 15px;
    }

    /* Tablet: 2 columns */
    @media (max-width: 768px) {

        .product-grid {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    /* Mobile: 1 column */
    @media (max-width: 480px) {

        .product-grid {
            grid-template-columns: 1fr;
        }

    }
</style>

</head>

<body>

<h1>Responsive Product Grid</h1>

<section class="product-grid">

    <!-- Smartphone -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="Smartphone">
        <h3>Smartphone</h3>
    </div>

    <!-- Laptop -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600" alt="Laptop">
        <h3>Laptop</h3>
    </div>

    <!-- Headphones -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
        <h3>Headphones</h3>
    </div>

    <!-- Smart Watch -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Smart Watch">
        <h3>Smart Watch</h3>
    </div>

    <!-- Camera -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600" alt="Camera">
        <h3>Camera</h3>
    </div>

    <!-- Sports Shoes -->
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Sports Shoes">
        <h3>Sports Shoes</h3>
    </div>

</section>

</body>

</html>
