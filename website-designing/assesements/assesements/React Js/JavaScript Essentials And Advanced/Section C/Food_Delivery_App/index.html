<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Section C - Food Delivery Menu App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .restaurant-bar {
      background: #fff;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-tabs button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background-color: #e2e8f0;
      color: #1e293b;
    }
    .nav-tabs button.active {
      background-color: #2563eb;
      color: #fff;
    }
    .nav-tabs button.clear-btn {
      background-color: #ef4444;
      color: #fff;
      margin-left: auto;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .dish-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .veg {
      background-color: #dcfce7;
      color: #166534;
    }
    .non-veg {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .add-btn {
      margin-top: auto;
      padding: 8px 12px;
      background-color: #16a34a;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .cart-panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>QuickBite Food Delivery</h1>

    <div class="restaurant-bar">
      <label for="restaurantSelect"><strong>Select Restaurant:</strong></label>
      <select id="restaurantSelect">
        <option value="">-- Choose a Restaurant --</option>
      </select>
      <span id="restaurantStatus"></span>
    </div>

    <div class="nav-tabs">
      <button id="browseTabBtn" type="button" class="active">Browse Menu</button>
      <button id="viewCartTabBtn" type="button">View Cart (<span id="cartCount">0</span>)</button>
      <button id="clearCartBtn" type="button" class="clear-btn">Clear Cart</button>
    </div>

    <section id="browseSection">
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <section id="cartSection" class="cart-panel hidden">
      <h2>Your Cart</h2>
      <ul id="cartItemsList"></ul>
      <p id="cartTotal" style="font-size: 18px; font-weight: bold;"></p>
    </section>
  </div>
</body>
</html>
